<!DOCTYPE html>
<html>
<head>
  <title>Load Balancer Simulator</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 40px;
      background: #f8f8f8;
    }
    h1 {
      color: #2c3e50;
    }
    button {
      margin: 10px;
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      background-color: #3498db;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #2980b9;
    }
    #result {
      margin-top: 30px;
      font-size: 18px;
      color: #34495e;
    }
  </style>
</head>
<body>
  <h1>Load Balancer Simulation</h1>
  <p>Choose a routing algorithm:</p>

  <button onclick="sendRequest('round_robin')">Round Robin</button>
  <button onclick="sendRequest('random')">Random</button>
  <button onclick="sendRequest('least_connections')">Least Connections</button>
  <button onclick="sendRequest('weighted_round_robin')">Weighted Round Robin</button>
  <button onclick="reset()">Reset Server Loads</button>

  <div id="result"></div>

  <script>
    const apiUrl = 'http://127.0.0.1:5000';  // Updated to local backend URL

    async function sendRequest(algorithm) {
      const res = await fetch(`${apiUrl}/request`, {  // Check if '/request' route exists in your backend
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ algorithm })
      });
      const data = await res.json();
      document.getElementById('result').innerText =
        `✅ Request handled by: ${data.server} (Algorithm: ${data.algorithm_used})`;
    }

    async function reset() {
      await fetch(`${apiUrl}/reset`, { method: 'POST' });  // Check if '/reset' route exists in your backend
      document.getElementById('result').innerText = "🔄 Server loads reset.";
    }
  </script>
</body>
</html>
